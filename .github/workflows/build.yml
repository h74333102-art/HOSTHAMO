name: Build HAMOHOST APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract HAMOHOST
        run: |
          unzip -o HAMOHOST_SOURCE_FOR_PHONE.zip -d project
          cp -r project/. project_build
          find project_build -maxdepth 2 -type f | head -50

      - name: Build APK
        working-directory: project_build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HAMOHOST-APK
          path: project_build/app/build/outputs/apk/debug/app-debug.apk
